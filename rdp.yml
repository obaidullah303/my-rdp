name: Windows RDP via Tailscale

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Download & Install Tailscale
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/silent" -Wait

    - name: Connect to Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Super-Speed Performance & Enable RDP
      run: |
        # Enable RDP & Network Firewall
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin P@ssword1234
        
        # Disable Visual Effects & Animations (Fixes Lag)
        Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2
        
        # Compress RDP Traffic for Fast Mobile Connection
        New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "CompressionLevel" -PropertyType DWORD -Value 2 -Force

    - name: Keep Alive Session
      run: |
        for ($i=0; $i -lt 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Output "Runner is active: $i minutes"
        }
